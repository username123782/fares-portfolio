    <svg className="sig" viewBox="0 0 640 140" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A line that begins as a digital signal and becomes a hand-drawn sketch line">

        <linearGradient id="sigGrad" x1="0" y1="0" x2="640" y2="0" gradientUnits="userSpaceOnUse">
          <stop offset="0" stopColor="var(--signal)" />

          <stop offset="1" stopColor="var(--oxide)" />

      </defs>
      <path
        className="sig-digital"
        d="M12,70 L12,42 L58,42 L58,98 L104,98 L104,42 L150,42 L150,98 L196,98 L196,42 L232,42 L232,70 L262,70"
        stroke="url(#sigGrad)"
        strokeWidth="5"

      <path

        d="M262,70 C292,38 308,104 340,58 C364,24 392,96 422,60 C450,32 482,90 512,56 C538,36 562,78 588,50 C602,40 612,58 626,48"

function Portfolio() {
  const [scrolled, setScrolled] = useState(false);

  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 12);
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  return (
    <div className="page">
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

        :root {
          --paper: #EAEBE1;
          --paper-alt: #E1E3D3;
          --card: #F3F4EC;
          --ink: #24231F;
          --ink-soft: #5B5A50;
          --rule: #C9CABA;
          --slab: #1E1D19;
          --slab-text: #EDEEE4;
          --slab-text-soft: #A8A79C;
          --signal: #2F7A72;
          --signal-bright: #4FB3A2;
          --oxide: #9C4B32;
          --oxide-soft: #C97A5C;
          --font-display: 'Space Grotesk', sans-serif;
          --font-body: 'IBM Plex Sans', sans-serif;
          --font-mono: 'IBM Plex Mono', monospace;
        }

        .page * { box-sizing: border-box; }
        .page {
          font-family: var(--font-body);
          color: var(--ink);
          background: var(--paper);
          line-height: 1.5;
          scroll-behavior: smooth;
        }
        .page a { color: inherit; text-decoration: none; }
        .page ::selection { background: var(--signal); color: var(--paper); }

        .page :focus-visible {
          outline: 2px solid var(--signal);
          outline-offset: 3px;
        }

        .wrap {
          max-width: 1100px;
          margin: 0 auto;
          padding-left: clamp(20px, 5vw, 56px);
          padding-right: clamp(20px, 5vw, 56px);
        }

        .eyebrow {
          font-family: var(--font-mono);
          font-size: 0.78rem;
          letter-spacing: 0.06em;
          color: var(--signal);
          margin: 0 0 14px;
        }
        .eyebrow.on-slab { color: var(--signal-bright); }
        .eyebrow.warm { color: var(--oxide); }

        h1, h2, h3 { font-family: var(--font-display); margin: 0; font-weight: 600; }

        section { scroll-margin-top: 84px; }

        /* NAV */
        .nav {
          position: fixed;
          top: 0; left: 0; right: 0;
          z-index: 40;
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 16px clamp(20px, 5vw, 56px);
          background: rgba(234, 235, 225, 0.72);
          backdrop-filter: blur(10px);
          border-bottom: 1px solid transparent;
          transition: background 0.25s ease, border-color 0.25s ease, padding 0.25s ease;
        }
        .nav.scrolled {
          background: rgba(234, 235, 225, 0.94);
          border-bottom: 1px solid var(--rule);
          padding-top: 11px;
          padding-bottom: 11px;
        }
        .nav-word {
          font-family: var(--font-mono);
          font-size: 0.82rem;
          letter-spacing: 0.05em;
          font-weight: 500;
        }
        .nav-links {
          display: flex;
          gap: clamp(14px, 2.4vw, 28px);
          list-style: none;
          margin: 0; padding: 0;
        }
        .nav-links a {
          font-family: var(--font-mono);
          font-size: 0.76rem;
          letter-spacing: 0.04em;
          text-transform: uppercase;
          color: var(--ink-soft);
          padding-bottom: 3px;
          border-bottom: 1px solid transparent;
          transition: color 0.2s ease, border-color 0.2s ease;
        }
        .nav-links a:hover { color: var(--signal); border-color: var(--signal); }

        /* HERO */
        .hero {
          position: relative;
          padding: 168px 0 96px;
          background-image: radial-gradient(circle, var(--rule) 1px, transparent 1px);
          background-size: 24px 24px;
          overflow: hidden;
        }
        .hero-inner { max-width: 720px; }
        .hero h1 {
          font-size: clamp(2.6rem, 6.6vw, 4.6rem);
          line-height: 1.02;
          letter-spacing: -0.01em;
          opacity: 0;
          animation: riseIn 0.7s ease forwards;
          animation-delay: 0.1s;
        }
        .hero .eyebrow { opacity: 0; animation: riseIn 0.7s ease forwards; }
        .hero-sub {
          font-size: clamp(1rem, 1.6vw, 1.15rem);
          color: var(--ink-soft);
          max-width: 540px;
          margin: 22px 0 0;
          opacity: 0;
          animation: riseIn 0.7s ease forwards;
          animation-delay: 0.22s;
        }
        .sig-wrap { margin-top: 48px; opacity: 0; animation: riseIn 0.9s ease forwards; animation-delay: 0.36s; }
        .sig { width: 100%; max-width: 560px; height: auto; display: block; }
        .sig-digital, .sig-sketch {
          stroke-dasharray: 900;
          stroke-dashoffset: 900;
          animation: draw 1.1s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        }
        .sig-digital { animation-delay: 0.6s; }
        .sig-sketch { animation-delay: 1.05s; }
        .sig-caption {
          font-family: var(--font-mono);
          font-size: 0.72rem;
          letter-spacing: 0.04em;
          color: var(--ink-soft);
          margin-top: 10px;
        }

        @keyframes riseIn {
          from { opacity: 0; transform: translateY(10px); }
          to { opacity: 1; transform: translateY(0); }
        }
        @keyframes draw {
          to { stroke-dashoffset: 0; }
        }
        @media (prefers-reduced-motion: reduce) {
          .hero h1, .hero .eyebrow, .hero-sub, .sig-wrap { animation: none; opacity: 1; }
          .sig-digital, .sig-sketch { animation: none; stroke-dashoffset: 0; }
        }

        /* SECTION SPACING */
        .section { padding: 96px 0; }
        .section-head { max-width: 620px; margin-bottom: 48px; }
        .section-head h2 { font-size: clamp(1.7rem, 3vw, 2.2rem); }

        /* ABOUT */
        .about-grid {
          display: grid;
          grid-template-columns: 1.3fr 1fr;
          gap: clamp(32px, 5vw, 64px);
          align-items: start;
        }
        .about-bio p { font-size: 1.02rem; color: var(--ink); max-width: 52ch; }
        .facts {
          border: 1px solid var(--rule);
          border-radius: 10px;
          background: var(--card);
          padding: 22px 24px;
        }
        .facts-row {
          display: flex;
          justify-content: space-between;
          gap: 16px;
          padding: 12px 0;
          border-bottom: 1px solid var(--rule);
          font-family: var(--font-mono);
          font-size: 0.82rem;
        }
        .facts-row:last-child { border-bottom: none; }
        .facts-row span:first-child { color: var(--ink-soft); letter-spacing: 0.03em; }
        .facts-row span:last-child { color: var(--ink); text-align: right; }

        /* TOOLKIT (dark band) */
        .band-dark {
          background: var(--slab);
          color: var(--slab-text);
        }
        .band-dark .section-head h2 { color: var(--slab-text); }
        .toolkit-groups {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 32px;
          margin-bottom: 44px;
        }
        .toolkit-group h3 {
          font-family: var(--font-mono);
          font-size: 0.8rem;
          letter-spacing: 0.05em;
          font-weight: 500;
          color: var(--slab-text-soft);
          text-transform: uppercase;
          margin-bottom: 14px;
        }
        .toolkit-group ul { list-style: none; margin: 0; padding: 0; }
        .toolkit-group li {
          font-size: 1rem;
          padding: 9px 0;
          border-bottom: 1px solid rgba(237, 238, 228, 0.12);
        }
        .toolkit-group li:last-child { border-bottom: none; }

        .coursework-label {
          font-family: var(--font-mono);
          font-size: 0.8rem;
          letter-spacing: 0.05em;
          color: var(--slab-text-soft);
          text-transform: uppercase;
          margin-bottom: 14px;
        }
        .coursework-grid {
          display: grid;
          grid-template-columns: repeat(2, 1fr);
          gap: 10px;
        }
        .coursework-grid span {
          font-family: var(--font-mono);
          font-size: 0.82rem;
          border: 1px solid rgba(237, 238, 228, 0.18);
          border-radius: 7px;
          padding: 10px 12px;
          color: var(--slab-text);
        }

        /* WORK */
        .featured-card {
          border: 1px solid var(--rule);
          border-radius: 12px;
          background: var(--card);
          padding: clamp(24px, 4vw, 40px);
          margin-bottom: 20px;
        }
        .tag {
          display: inline-block;
          font-family: var(--font-mono);
          font-size: 0.72rem;
          letter-spacing: 0.05em;
          color: var(--signal);
          border: 1px solid var(--signal);
          border-radius: 20px;
          padding: 5px 12px;
          margin-bottom: 16px;
        }
        .featured-card h3 { font-size: clamp(1.3rem, 2.4vw, 1.7rem); margin-bottom: 14px; }
        .featured-card p, .project-card p { color: var(--ink-soft); font-size: 0.97rem; max-width: 68ch; }

        .project-grid {
          display: grid;
          grid-template-columns: repeat(2, 1fr);
          gap: 20px;
        }
        .project-card {
          border: 1px solid var(--rule);
          border-radius: 12px;
          background: var(--card);
          padding: 26px;
          transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .project-card:hover {
          transform: translateY(-3px);
          box-shadow: 0 10px 24px rgba(36, 35, 31, 0.08);
        }
        .project-card h3 { font-size: 1.08rem; margin-bottom: 10px; }

        /* SKETCHBOOK */
        .sketch-intro { max-width: 56ch; color: var(--ink-soft); margin-bottom: 40px; font-size: 1.02rem; }
        .sketch-grid {
          display: grid;
          grid-template-columns: 1fr 1.3fr;
          gap: 24px;
          align-items: start;
        }
        .sketch-card {
          border: 1px solid var(--rule);
          border-radius: 12px;
          overflow: hidden;
          background: var(--card);
        }
        .sketch-card img { width: 100%; height: auto; display: block; }
        .sketch-cap {
          font-family: var(--font-mono);
          font-size: 0.78rem;
          color: var(--ink-soft);
          padding: 14px 16px;
          border-top: 1px solid var(--rule);
        }

        /* FOOTER */
        .footer { padding: 72px 0 40px; }
        .footer h2 { color: var(--slab-text); font-size: clamp(1.6rem, 3vw, 2.1rem); margin-bottom: 32px; }
        .contact-row {
          display: flex;
          flex-wrap: wrap;
          gap: 14px;
          margin-bottom: 48px;
        }
        .contact-item {
          display: flex;
          align-items: center;
          gap: 9px;
          font-family: var(--font-mono);
          font-size: 0.86rem;
          border: 1px solid rgba(237, 238, 228, 0.2);
          border-radius: 20px;
          padding: 10px 16px;
          color: var(--slab-text);
          transition: border-color 0.2s ease, color 0.2s ease;
        }
        .contact-item:hover { border-color: var(--signal-bright); color: var(--signal-bright); }
        .contact-item svg { width: 15px; height: 15px; flex-shrink: 0; }
        .footer-bottom {
          display: flex;
          justify-content: space-between;
          flex-wrap: wrap;
          gap: 10px;
          padding-top: 24px;
          border-top: 1px solid rgba(237, 238, 228, 0.15);
          font-family: var(--font-mono);
          font-size: 0.76rem;
          color: var(--slab-text-soft);
        }

        /* RESPONSIVE */
        @media (max-width: 760px) {
          .nav-links { gap: 12px; }
          .nav-links a { font-size: 0.68rem; }
          .hero { padding-top: 132px; }
          .about-grid { grid-template-columns: 1fr; }
          .toolkit-groups { grid-template-columns: 1fr; }
          .coursework-grid { grid-template-columns: 1fr; }
          .project-grid { grid-template-columns: 1fr; }
          .sketch-grid { grid-template-columns: 1fr; }
          .contact-item { font-size: 0.8rem; }
        }
        @media (max-width: 480px) {
          .nav-links { display: none; }
        }
      `}</style>

      <nav className={`nav${scrolled ? " scrolled" : ""}`}>
        <span className="nav-word">FARES SAMEH</span>
        <ul className="nav-links">
          {NAV_LINKS.map((l) => (
            <li key={l.href}><a href={l.href}>{l.label}</a></li>
          ))}
        </ul>
      </nav>

      <header className="hero grid-paper">
        <div className="wrap hero-inner">
          <p className="eyebrow">CS UNDERGRAD — E-JUST, ALEXANDRIA</p>
          <h1>Fares Sameh</h1>
          <p className="hero-sub">
            I build software and systems across robotics, web, and coursework —
            and draw in graphite when I'm away from a screen.
          </p>
          <div className="sig-wrap">
            <SignatureLine />
            <p className="sig-caption">FIG. 1 — SIGNAL TO GRAPHITE</p>
          </div>
        </div>
      </header>

      <section id="about" className="section">
        <div className="wrap about-grid">
          <div className="about-bio">
            <p className="eyebrow">// about</p>
            <h2 style={{ marginBottom: 20 }}>Background</h2>
            <p>
              I'm a computer science undergrad at E-JUST, working mostly at the intersection of
              robotics, algorithms, and web development. I completed an internship at ANRPC
              Petroleum Company, and my coursework and side projects span systems, structures, and
              logic. Away from a screen, drawing has stayed a constant: mostly graphite portraits,
              plus whatever ends up on the nearest flat surface.
            </p>
          </div>
          <div className="facts">
            {QUICK_FACTS.map((f) => (
              <div className="facts-row" key={f.label}>
                <span>{f.label}</span>
                <span>{f.value}</span>
              </div>
            ))}
          </div>
        </div>
      </section>

      <section id="toolkit" className="section band-dark">
        <div className="wrap">
          <div className="section-head">
            <p className="eyebrow on-slab">// toolkit</p>
            <h2>Toolkit</h2>
          </div>
          <div className="toolkit-groups">
            {TOOLKIT_GROUPS.map((g) => (
              <div className="toolkit-group" key={g.title}>
                <h3>{g.title}</h3>
                <ul>
                  {g.items.map((item) => (
                    <li key={item}>{item}</li>
                  ))}
                </ul>
              </div>
            ))}
          </div>
          <div>
            <p className="coursework-label">Coursework</p>
            <div className="coursework-grid">
              {COURSEWORK.map((c) => (
                <span key={c}>{c}</span>
              ))}
            </div>
          </div>
        </div>
      </section>

      <section id="work" className="section">
        <div className="wrap">
          <div className="section-head">
            <p className="eyebrow">// work</p>
            <h2>Work</h2>
          </div>
          <div className="featured-card">
            <span className="tag">{FEATURED_PROJECT.tag}</span>
            <h3>{FEATURED_PROJECT.title}</h3>
            <p>{FEATURED_PROJECT.desc}</p>
          </div>
          <div className="project-grid">
            {PROJECTS.map((p) => (
              <div className="project-card" key={p.title}>
                <span className="tag">{p.tag}</span>
                <h3>{p.title}</h3>
                <p>{p.desc}</p>
              </div>
            ))}
          </div>
        </div>
      </section>

      <section id="sketchbook" className="section">
        <div className="wrap">
          <div className="section-head">
            <p className="eyebrow warm">// sketchbook</p>
            <h2>Sketchbook</h2>
          </div>
          <p className="sketch-intro">The same attention to line and structure, minus the compiler.</p>
          <div className="sketch-grid">
            <div className="sketch-card">
              <img src={SKETCH_IMG} alt="Graphite portrait sketch of a young woman with her hair in a bun, rendered with cross-hatched shading" />
              <p className="sketch-cap">Graphite portrait study</p>
            </div>
            <div className="sketch-card">
              <img src={DESK_IMG} alt="A wooden school desk hand-painted with a collage of comic and anime character illustrations" />
              <p className="sketch-cap">Painted desk, done between classes</p>
            </div>
          </div>
        </div>
      </section>

      <footer id="contact" className="footer band-dark">
        <div className="wrap">
          <p className="eyebrow on-slab">// contact</p>
          <h2>Let's talk</h2>
          <div className="contact-row">
            {CONTACT.map((c) => {
              const Icon = c.icon;
              return (
                <a className="contact-item" href={c.href} key={c.label} target="_blank" rel="noreferrer">
                  <Icon />
                  {c.label}
                </a>
              );
            })}
            <span className="contact-item" style={{ cursor: "default" }}>
              <MapPin />
              Alexandria, Egypt
            </span>
          </div>
          <div className="footer-bottom">
            <span>Fares Sameh</span>
            <span>Computer Science — E-JUST</span>
          </div>
        </div>
      </footer>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(Portfolio));
</script>
